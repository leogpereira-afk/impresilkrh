name: Deploy (GitHub Pages)

# Publica o build da SPA no GitHub Pages (único host).
# O backend é o Supabase (Auth + Postgres + Storage + Edge Functions), acessado
# direto pelo navegador com a anon key (pública por design — protegida por RLS).
#
# POR QUE POR BRANCH E NÃO POR actions/deploy-pages:
# Em 06/08/2026 o caminho oficial (upload-pages-artifact + deploy-pages) parou de
# funcionar SÓ neste repositório: o deployment ficava em "deployment_queued" até a
# action desistir em 10 min, com a configuração idêntica à do painel-impresilk, que
# publicava normalmente. Apagar e recriar o site do Pages não resolveu. O que
# resolveu foi servir de uma branch (build_type "legacy"), que é outro pipeline.
# Se um dia o caminho oficial voltar, dá para reverter para o workflow anterior —
# está no histórico deste arquivo.
on:
  # TODO push na main roda, inclusive o so da vez (pegar, passar, liberar e
  # aceitar mexem so no VEZ.md e em docs/passagens/): republica o mesmo site e
  # confere a vez. Nao ponha paths-ignore aqui: a conferencia parte do ultimo
  # Deploy verde, e um push da vez que nao roda o Deploy deixa a main a frente
  # do verde depois de cada pegar ou passar (no PCP isso travou o pcp_ref do
  # painel ate a revisao final de 11/10/2026).
  push:
    branches: [main]
  workflow_dispatch: {}

# contents: escrever a branch gh-pages, que é o que o Pages serve.
# pages: pedir o build pela API no último passo (sem isto o POST devolve 403).
# actions: ler o último Deploy verde, de onde parte a conferência da vez.
permissions:
  contents: write
  pages: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    # O caminho antigo (actions/deploy-pages + environment github-pages) tinha a
    # trava de branch do AMBIENTE, que só deixava `main` publicar. Publicando por
    # branch essa trava não existe mais: sem esta condição, um workflow_dispatch
    # de qualquer branch — inclusive uma de teste — iria direto para produção.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          # Historia inteira: a conferencia da vez olha CADA commit desde o
          # ultimo Deploy verde.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Um agente por repositorio de cada vez (AGENTS.md, secao 5), o mesmo
      # protocolo do PCP (instalado aqui em 12/10/2026). Cada commit leva
      # "Agente: X" e X e quem tem a vez no VEZ.md daquele commit.
      #
      # BASE = o ULTIMO DEPLOY VERDE da main, nao o "before" do push: assim o
      # push que nao chegou a rodar tambem e conferido, e o commit recusado
      # continua vermelho nos pushes seguintes ate o dono aceita-lo (nao vai ao
      # ar junto com o proximo). O verde so vale como base se estiver na
      # historia desta main (historia reescrita); senao vale o before, e sem ele
      # o ultimo commit, com aviso.
      # O CONFERIDOR vem da base: mexer no vez.cjs no proprio push nao o desliga.
      # O primeiro push do protocolo parte de um verde sem scripts/vez.cjs: ai
      # vale o do proprio push.
      # A CHAVE do GitHub: commit do dono pelo site (editor ou botao de merge) vem
      # assinado por ela e vale como "Agente: leo" sem a linha.
      # Fica ANTES do build e da gh-pages: vermelho aqui nao publica nada.
      - name: Commits dentro da vez?
        env:
          ANTES: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if ! verde=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""'); then
            echo "::error::Nao consegui ler o ultimo Deploy verde pela API do GitHub. Sem ele nao sei o que conferir: rode de novo."
            exit 1
          fi
          na_historia() { [ -n "$1" ] && git cat-file -e "${1}^{commit}" 2>/dev/null && git merge-base --is-ancestor "$1" HEAD; }
          if na_historia "$verde"; then
            base="$verde"
          elif na_historia "$ANTES"; then
            base="$ANTES"; echo "::warning::O ultimo Deploy verde (${verde:-nenhum}) nao esta na historia desta main (reescrita?): confiro so este push."
          else
            base=$(git rev-parse HEAD~1); echo "::warning::Nem o ultimo Deploy verde nem o before estao na historia desta main: confiro so o ultimo commit."
          fi
          echo "base da conferencia: $base (ultimo Deploy verde: ${verde:-nenhum})"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p -m 700 "$GNUPGHOME"
          curl -fsSL https://github.com/web-flow.gpg | gpg --batch --quiet --import || echo "::warning::Nao importei a chave do GitHub: commit do dono feito pelo site, sem a linha Agente, vai ficar vermelho."
          if git cat-file -e "$base:scripts/vez.cjs" 2>/dev/null; then
            git show "$base:scripts/vez.cjs" > "$RUNNER_TEMP/vez.cjs"
          else
            cp scripts/vez.cjs "$RUNNER_TEMP/vez.cjs"
          fi
          RH_RAIZ="$GITHUB_WORKSPACE" node "$RUNNER_TEMP/vez.cjs" conferir "$base..HEAD"

      - run: npm ci

      - name: Conferir antes de publicar
        run: npm run verificar

      # As chaves PÚBLICAS do Supabase (URL + publishable/anon) já vêm de
      # .env.production (versionado — são valores que vão no navegador de todo
      # jeito). Nenhuma variável precisa ser configurada no GitHub.
      - run: npm run build

      # SPA no GitHub Pages: não há rewrite de servidor. Copiar o index.html para
      # 404.html faz o Pages servir o app em QUALQUER caminho (refresh/bookmark de
      # subpágina), e o React Router (com basename) assume dali.
      - run: cp dist/index.html dist/404.html

      # Sem isto o Pages passa o site pelo Jekyll, que ignora arquivos e pastas
      # começados por "_" — silenciosamente, servindo 404 só para alguns assets.
      - run: touch dist/.nojekyll

      - name: Publicar na branch gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q
          git checkout -qb gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "publicar ${GITHUB_SHA::7}"
          # A branch é o resultado do build, não histórico de trabalho: cada
          # publicação a substitui inteira.
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      # O push na branch normalmente já dispara o build do Pages, mas em 10/08 ele
      # não disparou sozinho e o site ficou fora do ar. Pedir explicitamente custa
      # uma chamada e tira essa dúvida do caminho.
      - name: Pedir o build do Pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" > /dev/null
