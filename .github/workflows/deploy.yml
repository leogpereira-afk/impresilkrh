name: Deploy (GitHub Pages)

# Publica o build da SPA no GitHub Pages. O backend é o Supabase (Auth +
# Postgres + Storage + Edge Functions), acessado direto pelo navegador com a
# anon key (pública por design — protegida por RLS).
#
# Dispara na `nuvem-supabase` durante a validação (assim o site novo sobe SEM
# tocar na `main`, que o Netlify ainda reconstrói) e também na `main`, para
# quando for feita a virada final (sair do Netlify).
on:
  push:
    branches: [main, nuvem-supabase]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # As chaves PÚBLICAS do Supabase (URL + publishable/anon) já vêm de
      # .env.production (versionado — são valores que vão no navegador de todo
      # jeito). Nenhuma variável precisa ser configurada no GitHub.
      - run: npm run build

      # SPA no GitHub Pages: não existe rewrite de servidor (o [[redirects]] do
      # Netlify não tem equivalente aqui). Copiar o index.html para 404.html faz
      # o Pages servir o app em QUALQUER caminho, e o React Router assume dali.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
