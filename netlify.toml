# Netlify continua reconstruindo a `main` (o site impresilkrh.netlify.app segue
# no ar durante a transição). A diferença do GitHub Pages: o Netlify serve o app
# na RAIZ (/), enquanto o GitHub Pages serve em /impresilkrh/. Por isso o build
# do Netlify precisa de BASE_PATH=/ — senão os arquivos são pedidos em
# /impresilkrh/assets/... e dão 404 (tela branca).
#
# O GitHub Pages (via .github/workflows/deploy.yml) NÃO lê este arquivo e usa o
# padrão /impresilkrh/. Assim os dois hosts funcionam, cada um no seu caminho.
#
# Não há mais funções do Netlify — o backend é o Supabase. Este arquivo é só
# build + roteamento de SPA, até a equipe migrar de vez para o GitHub Pages.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  BASE_PATH = "/"
  NODE_VERSION = "20"

# SPA: qualquer rota cai no index.html (o React Router assume no cliente).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
